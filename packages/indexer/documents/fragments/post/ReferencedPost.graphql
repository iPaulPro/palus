fragment ReferencedPost on Post {
  __typename
  id
  slug
  isDeleted
  isEdited
  contentUri(request: { useSnapshot: false })
  feed {
    ...PostFeedInfo
  }
  app {
    metadata {
      name
    }
  }
  author {
    ...Account
  }
  metadata {
    ...PostMetadata
  }
  stats {
    ...PostStats
  }
  operations {
    ...LoggedInPostOperations
  }
  actions {
    __typename
    ...UnknownPostAction
  }
  mentions {
    ...PostMention
  }
  timestamp
}
